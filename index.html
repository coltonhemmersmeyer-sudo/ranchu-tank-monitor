<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranchu Tank Monitor</title>
<style>
:root{
 --bg:#eaf8fc;--surface:#fff;--surface2:#f3fbfd;--line:#cce8ef;
 --text:#17445a;--muted:#638697;--blue:#36a9d2;--blue2:#167fa9;
 --teal:#36bda7;--orange:#f2a34b;--yellow:#f5ca59;--red:#e85f69;
 --shadow:0 9px 24px rgba(35,116,143,.11);--radius:20px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden}
body{font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text);background:radial-gradient(ellipse at 15% 0%,#d1f1f8 0,transparent 42%),linear-gradient(180deg,#eaf8fc,#f6fcfd 65%,#e6f6fa);min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}
.sidebar{background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-right:1px solid var(--line);padding:22px 15px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 7px 17px;border-bottom:1px solid var(--line)}
.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,#70d3e9,#35bba9);display:grid;place-items:center;font-size:25px;box-shadow:0 5px 12px #9bdce5}
.brand h1{font-size:15px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:10px;letter-spacing:1px}
.nav-label{font-size:10px;color:#7da0ae;text-transform:uppercase;letter-spacing:1.5px;padding:0 10px;margin-bottom:-10px}
nav{display:grid;gap:5px}
.nav-btn{border:1px solid transparent;background:transparent;color:#416a7b;text-align:left;padding:11px 12px;border-radius:13px;display:flex;align-items:center;gap:11px;font-size:13px;font-weight:650;transition:.15s}
.nav-btn:hover{background:#e8f7fa;color:var(--blue2)}.nav-btn.active{background:#dff4f8;border-color:#b8e5ee;color:#126d91}
.nav-icon{width:21px;text-align:center;font-size:16px}
.sidebar-bottom{margin-top:auto;border:1px solid var(--line);background:#f2fbfd;border-radius:15px;padding:13px}
.sidebar-bottom strong{display:block;font-size:12px;margin-bottom:5px}.sidebar-bottom span{font-size:11px;color:var(--muted)}
.main{min-width:0;padding:27px clamp(16px,3vw,42px) 48px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.eyebrow{color:var(--blue2);font-size:10px;letter-spacing:1.8px;text-transform:uppercase;font-weight:800}
h2{font-size:27px;margin:6px 0 5px;letter-spacing:-.6px}.sub{color:var(--muted);font-size:13px;margin:0;line-height:1.5}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:10px;color:#497184;background:#fff;white-space:nowrap;font-weight:700}
.pill.sim{border-color:#f1d99a;color:#92651b;background:#fff8e5}
.page{display:none;animation:fade .18s ease}.page.active{display:block}
@keyframes fade{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:15px}
.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow);min-width:0}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.card h3{font-size:15px;margin:0}.hint{font-size:11px;color:var(--muted);line-height:1.55}
.big{font-size:36px;font-weight:800;letter-spacing:-1.4px;color:#155c79}.unit{font-size:13px;color:var(--muted);font-weight:600}
.stat-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:7px}
.progress{height:11px;background:#e1f1f5;border-radius:99px;overflow:hidden;margin:15px 0 8px}
.progress>span{height:100%;display:block;background:linear-gradient(90deg,#38a9d4,#3cc7a9);border-radius:99px;transition:width .25s}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.mini{background:#f1fafc;border:1px solid #d8edf2;border-radius:14px;padding:12px}
.mini b{display:block;font-size:17px;margin-bottom:4px;color:#1d6782}.mini span{font-size:10px;color:var(--muted)}
.btn{border:1px solid #2c98bb;background:linear-gradient(135deg,#39afd2,#218caf);color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:750;box-shadow:0 4px 10px rgba(36,143,177,.13)}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}.btn.secondary{background:#f1fafc;border-color:#cde8ef;color:#376a7e;box-shadow:none}.btn.danger{background:#fff0f1;border-color:#f2b9be;color:#b53643;box-shadow:none}.btn.green{background:linear-gradient(135deg,#47c7ae,#25a58e);border-color:#2db49d}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:11px;color:#527889;font-weight:700}
input,select,textarea{width:100%;background:#fbfeff;border:1px solid #c9e3eb;color:var(--text);padding:11px;border-radius:11px;outline:none}
textarea{min-height:88px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #dff4fa}
.segment{display:flex;gap:6px;flex-wrap:wrap}.segment button{background:#f4fafc;border:1px solid var(--line);color:#547889;border-radius:10px;padding:8px 12px;font-size:11px;font-weight:700}.segment button.selected{background:#dff4f8;border-color:#8fd4e3;color:#126d91}
.notice{padding:13px 14px;border-radius:14px;border:1px solid #efd995;background:#fff8e6;color:#88621e;font-size:12px;line-height:1.55}
.notice.info{border-color:#bfe4ed;background:#effafd;color:#36758d}.notice.good{border-color:#b8e6d9;background:#edfaf5;color:#26785f}.notice.danger{border-color:#f1b8be;background:#fff0f1;color:#ad3441}.notice.critical{border:2px solid #df626b;background:#fff0f1;color:#a62936;font-weight:700}
.list{display:grid;gap:8px}.list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e5f1f4;padding:10px 0;font-size:12px}.list-row:last-child{border:0}.muted{color:var(--muted)}
.badge{font-size:10px;padding:5px 9px;border-radius:99px;background:#e8f8f1;color:#26775d;border:1px solid #c5eadc;font-weight:750;white-space:nowrap}.badge.warn{background:#fff7e3;color:#956719;border-color:#f0dca5}.badge.orange{background:#fff0df;color:#a65d16;border-color:#f3c48e}.badge.red{background:#fff0f1;color:#b3313e;border-color:#f0b7bd}.badge.off{background:#f0f6f8;color:#6b8794;border-color:#d9e7eb}
.chart{height:165px;display:flex;align-items:flex-end;gap:9px;padding:10px 2px 0;border-bottom:1px solid #c9e1e8}
.bar-wrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;min-width:0}
.bar{width:min(100%,30px);background:linear-gradient(180deg,#69cbe4,#268eae);border-radius:8px 8px 2px 2px;min-height:4px}
.bar-wrap small{font-size:9px;color:var(--muted)}
.camera{height:205px;border:1px dashed #a9d4df;border-radius:16px;background:repeating-linear-gradient(135deg,#eff9fb,#eff9fb 12px,#e5f5f8 12px,#e5f5f8 24px);display:grid;place-items:center;text-align:center;color:var(--muted)}
.camera b{display:block;color:#326b80;margin:8px 0}
.modal-backdrop{position:fixed;inset:0;background:rgba(16,65,82,.38);display:none;align-items:center;justify-content:center;padding:20px;z-index:20;backdrop-filter:blur(4px)}
.modal-backdrop.show{display:flex}.modal{max-width:460px;width:100%;background:#fff;border:1px solid #c8e6ed;border-radius:22px;padding:23px;box-shadow:0 20px 70px rgba(24,89,111,.25)}
.modal h3{font-size:19px;margin:0 0 9px}.modal p{font-size:13px;color:#55798a;line-height:1.6}.modal .actions{justify-content:flex-end}
.toast{position:fixed;bottom:20px;right:20px;background:#eafaf4;border:1px solid #b8e7d7;color:#24785d;padding:12px 16px;border-radius:13px;font-size:12px;display:none;z-index:30;box-shadow:var(--shadow);max-width:min(420px,calc(100vw - 24px))}
.toast.show{display:block}footer{color:#7c9aa6;font-size:10px;margin-top:22px;text-align:center}
.mobile-nav-label,.mobile-page-select{display:none}
.empty{color:var(--muted);font-size:12px;padding:10px 0}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fish-photo{width:100%;height:130px;object-fit:cover;border-radius:13px;background:#e8f6f9}
.warning-level{border-left:5px solid var(--yellow)}.warning-level.orange{border-left-color:var(--orange)}.warning-level.red{border-left-color:var(--red)}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{padding:12px 14px;border-right:0;border-bottom:1px solid var(--line);gap:10px}.brand{padding:0 4px 9px}.nav-label,.sidebar-bottom{display:none}nav{display:flex;overflow-x:auto;overscroll-behavior-x:contain;padding:2px 0 8px;gap:7px;scrollbar-width:thin}.nav-btn{white-space:nowrap;flex:0 0 auto;padding:11px 13px;font-size:13px}.main{padding:20px 18px 40px}.span-8,.span-7,.span-5,.span-4{grid-column:span 6}}
@media(max-width:600px){.sidebar{padding:11px 10px}.brand h1{font-size:17px}.brand p{font-size:12px}.logo{width:44px;height:44px}.nav-label,nav,.sidebar-bottom{display:none!important}.mobile-nav-label{display
